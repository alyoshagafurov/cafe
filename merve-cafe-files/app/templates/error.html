{% extends "base.html" %}
{% block title %}{{ code }} — {{ BRAND }}{% endblock %}

{% block content %}
<section class="section error-section">
  <div class="container center">
    <div class="error-code">{{ code }}</div>
    <h1>{{ msg }}</h1>
    <p class="muted">Возможно, страница была перемещена или больше не существует.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-gold">Вернуться на главную</a>
  </div>
</section>
{% endblock %}
