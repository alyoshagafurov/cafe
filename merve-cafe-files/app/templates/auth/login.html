{% extends "base.html" %}
{% block title %}Вход — {{ BRAND }}{% endblock %}

{% block content %}
<section class="section auth-section">
  <div class="container auth-wrap">
    <div class="auth-card reveal">
      <span class="eyebrow">Welcome back</span>
      <h1>Вход в аккаунт</h1>
      <p class="muted">Войдите, чтобы видеть брони, заказы и бонусы.</p>
      <form method="post" action="{{ url_for('auth.login') }}" class="lux-form">
        <div class="field"><label>Имя пользователя</label><input type="text" name="username" required autofocus></div>
        <div class="field"><label>Пароль</label><input type="password" name="password" required></div>
        <label class="switch-row">
          <input type="checkbox" name="remember" value="1">
          <span class="switch"></span>
          <span class="switch-label">Запомнить меня</span>
        </label>
        <button type="submit" class="btn btn-gold btn-block btn-lg">Войти</button>
      </form>
      <p class="auth-alt">Нет аккаунта? <a href="{{ url_for('auth.register') }}">Зарегистрироваться</a></p>
    </div>
  </div>
</section>
{% endblock %}
