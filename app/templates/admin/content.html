{% extends "admin/base_admin.html" %}
{% block title %}Контент — Admin{% endblock %}

{% block content %}
<div class="admin-head"><div><h1>Контент сайта</h1><div class="sub">Hero-секция и тексты главной страницы</div></div></div>

<div class="panel">
  <form method="post" action="{{ url_for('admin.content') }}" class="form-grid">
    <div class="fld full"><label>Заголовок Hero</label><input type="text" name="hero_title" value="{{ values.hero_title }}"></div>
    <div class="fld full"><label>Подзаголовок Hero</label><input type="text" name="hero_subtitle" value="{{ values.hero_subtitle }}"></div>
    <div class="fld full"><label>Тэглайн (над заголовком)</label><input type="text" name="hero_tagline" value="{{ values.hero_tagline }}"></div>
    <div class="fld full"><label>Текст «О нас»</label><textarea name="about_text" rows="4">{{ values.about_text }}</textarea></div>
    <div class="fld full"><label>Баннер (часы работы)</label><input type="text" name="banner_text" value="{{ values.banner_text }}"></div>
    <div class="full"><button class="btn btn-gold" type="submit">Сохранить изменения</button></div>
  </form>
</div>
{% endblock %}
