<header class="site-header">
  <nav class="nav container">
    <a class="brand" href="{{ url_for('main.index') }}">
      <span>MER<b>VE</b></span><small>Café · Dushanbe</small>
    </a>
    <ul class="nav-links">
      <li><a href="{{ url_for('main.index') }}">Главная</a></li>
      <li><a href="{{ url_for('menu.menu') }}">Меню</a></li>
      <li><a href="{{ url_for('main.gallery') }}">Галерея</a></li>
      <li><a href="{{ url_for('main.about') }}">О нас</a></li>
      <li><a href="{{ url_for('main.blog') }}">Журнал</a></li>
      <li><a href="{{ url_for('main.contact') }}">Контакты</a></li>
      <li><a href="{{ url_for('booking.booking') }}" class="gold-text">Бронь</a></li>
    </ul>
    <div class="nav-actions">
      <a class="cart-btn magnetic" href="{{ url_for('orders.checkout') }}" aria-label="Корзина">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 01-8 0"/></svg>
        {% if cart_count %}<span class="cart-count">{{ cart_count }}</span>{% endif %}
      </a>
      {% if current_user.is_authenticated %}
        {% if current_user.is_admin %}
          <a class="btn btn-ghost btn-sm" href="{{ url_for('admin.dashboard') }}">Admin</a>
        {% else %}
          <a class="btn btn-ghost btn-sm" href="{{ url_for('account.dashboard') }}">Кабинет</a>
        {% endif %}
      {% else %}
        <a class="btn btn-gold btn-sm magnetic" href="{{ url_for('auth.login') }}">Войти</a>
      {% endif %}
      <button class="nav-toggle" aria-label="Меню"><span></span><span></span><span></span></button>
    </div>
  </nav>
</header>
