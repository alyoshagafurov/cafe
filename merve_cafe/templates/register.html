{% extends 'base.html' %}
{% block title %}Регистрация — МЕРВЕ{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-bg-deco">مروه</div>
  <div class="auth-card reveal-up">
    <div class="auth-logo">
      <span class="logo-arabic">مروه</span>
      <span class="logo-text">МЕРВЕ</span>
    </div>
    <h1 class="auth-title">Создать аккаунт</h1>
    <p class="auth-subtitle">Присоединяйтесь к семье МЕРВЕ</p>
    <form method="POST" class="auth-form">
      <div class="form-group">
        <label>Имя пользователя</label>
        <input type="text" name="username" required placeholder="Ваше имя"/>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required placeholder="your@email.com"/>
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" name="password" required placeholder="Минимум 6 символов" minlength="6"/>
      </div>
      <button type="submit" class="btn-gold btn-full">Зарегистрироваться</button>
    </form>
    <div class="auth-footer">
      <p>Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
    </div>
  </div>
</section>
{% endblock %}
