{% extends 'base.html' %}
{% block title %}Войти — МЕРВЕ{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-bg-deco">مروه</div>
  <div class="auth-card reveal-up">
    <div class="auth-logo">
      <span class="logo-arabic">مروه</span>
      <span class="logo-text">МЕРВЕ</span>
    </div>
    <h1 class="auth-title">Добро пожаловать</h1>
    <p class="auth-subtitle">Войдите в свой аккаунт</p>
    <form method="POST" class="auth-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required placeholder="your@email.com"/>
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" name="password" required placeholder="••••••••"/>
      </div>
      <button type="submit" class="btn-gold btn-full">Войти</button>
    </form>
    <div class="auth-footer">
      <p>Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a></p>
    </div>
  </div>
</section>
{% endblock %}
